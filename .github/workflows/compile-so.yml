name: Compilar .so (Linux & Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux-and-android:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    # 1. Compilação para Linux (x86_64)
    - name: Compilar .so para Linux (x86_64)
      run: g++ -O2 -fPIC -shared main.cpp -o libmeuarquivo_linux_x86_64.so

    # 2. Compilação para Android usando o NDK oficial do próprio GitHub
    - name: Compilar .so para Android (arm64-v8a)
      run: |
        # Encontra a pasta do NDK que já vem embutida no servidor do GitHub
        NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -1)
        
        # Executa o compilador do Android diretamente
        $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
          -O2 -fPIC -shared main.cpp -o libmeuarquivo_android_arm64.so

    # 3. Disponibilizar os dois arquivos para download
    - name: Salvar arquivos .so (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: bibliotecas-so
        path: |
          libmeuarquivo_linux_x86_64.so
          libmeuarquivo_android_arm64.so
