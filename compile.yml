name: Compilar .so (Linux & Android)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux-and-android:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    # 1. Compilação para Linux (x86_64)
    - name: Compilar .so para Linux (x86_64)
      run: g++ -O2 -fPIC -shared main.cpp -o libmeuarquivo_linux_x86_64.so

    # 2. Configurar o Android NDK
    - name: Instalar Android NDK
      uses: nmdh/setup-ndk@v1
      with:
        ndk-version: r26b

    # 3. Compilação para Android (arm64-v8a / 64-bit)
    - name: Compilar .so para Android (arm64-v8a)
      run: |
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
          -O2 -fPIC -shared main.cpp -o libmeuarquivo_android_arm64.so

    # 4. Disponibilizar os dois arquivos para download
    - name: Salvar arquivos .so (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: bibliotecas-so
        path: |
          libmeuarquivo_linux_x86_64.so
          libmeuarquivo_android_arm64.so
